services:
  vote:
    build: 
      context: ./vote
    ports:
      - "5000:80"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db/postgres
      - OPTION_A=Cats
      - OPTION_B=Dogs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  result:
    build: 
      context: ./result
    ports:
      - "5001:80"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db/postgres
    depends_on:
      db:
        condition: service_healthy 
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
