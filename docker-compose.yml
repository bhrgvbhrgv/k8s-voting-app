services:
  vote:
    build: 
      context: ./vote
    ports:
      - "5000:80"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db/postgres
      - OPTION_A=Cats
      - OPTION_B=Dogs
    depends_on:
      db:
        condition: service_healthy
    networks:
      - app-network

  result:
    build: 
      context: ./result
    ports:
      - "5001:80"
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db/postgres
    depends_on:
      db:
        condition: service_healthy 
    networks:
      - app-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: "postgres"
      POSTGRES_PASSWORD: "postgres"
      POSTGRES_DB: "postgres"
    volumes:
      - "db-data:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/docker-compose/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks:
      - app-network

  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    ports:
      - "3100:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/docker-compose/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/docker-compose/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - app-network

volumes:
  db-data:

networks:
  app-network:
